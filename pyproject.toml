[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py_storebridge"
version = "1.1.0"
description = "A unified, production-ready cloud and on-premises storage SDK for Python. Switch providers with one config line."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Asif Khan", email = "ak2311581@gmail.com" },
]
keywords = [
    "storage",
    "s3",
    "gcs",
    "azure",
    "cloudflare",
    "r2",
    "minio",
    "supabase",
    "firebase",
    "appwrite",
    "backblaze",
    "digitalocean",
    "spaces",
    "cloud",
    "onprem",
    "filesystem",
    "upload",
    "pydantic",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34.0"]
r2 = ["boto3>=1.34.0"]
gcs = ["google-cloud-storage>=2.14.0"]
azure = ["azure-storage-blob>=12.19.0"]
spaces = ["boto3>=1.34.0"]
b2 = ["boto3>=1.34.0"]
minio = ["boto3>=1.34.0"]
supabase = ["httpx>=0.27.0"]
firebase = ["google-cloud-storage>=2.14.0", "google-auth>=2.23.0"]
appwrite = ["httpx>=0.27.0"]
onprem = ["boto3>=1.34.0"]
all = [
    "boto3>=1.34.0",
    "google-cloud-storage>=2.14.0",
    "google-auth>=2.23.0",
    "azure-storage-blob>=12.19.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
build = [
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/ak9347128658/py_storebridge"
Documentation = "https://github.com/ak9347128658/py_storebridge#readme"
Repository = "https://github.com/ak9347128658/py_storebridge"
Issues = "https://github.com/ak9347128658/py_storebridge/issues"
Changelog = "https://github.com/ak9347128658/py_storebridge/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
py_storebridge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["py_storebridge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
